<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada · Maxmilian Duarte</title>
<style>
  :root { --bg:#f3f4f1; --ink:#141816; --muted:#66706b; --accent:#0b6b4f; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg:#111413; --ink:#e8ece9; --muted:#8b948f; --accent:#5fcf9f; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
         font:16px/1.6 system-ui, sans-serif; padding:16px; }
  main { max-width:520px; }
  .code { font:600 13px/1 ui-monospace, monospace; color:var(--muted); }
  h1 { font-size:40px; line-height:1.05; margin:12px 0; }
  a { color:var(--ink); font-weight:600; }
</style>
</head>
<body>
<main>
  <p class="code">Erro 404</p>
  <h1>Essa página não existe.</h1>
  <p>O endereço pode ter mudado. <a href="/">Voltar ao início</a> · <a href="/en/">Back to home</a></p>
</main>
</body>
</html>
