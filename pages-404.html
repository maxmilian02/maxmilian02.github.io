<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página não encontrada · Maxmilian Duarte</title>
<style>
  :root { --bg:#e7e9ec; --ink:#15171b; --muted:#5d636c; --amber:#e8890c; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg:#121418; --ink:#eaebed; --muted:#8e949d; --amber:#ffa21a; } }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--ink);
         font:16px/1.6 system-ui, sans-serif; padding:16px; }
  main { max-width:520px; }
  .code { font:600 13px/1 ui-monospace, monospace; letter-spacing:.14em; color:var(--muted); }
  h1 { font-size:40px; line-height:1.05; margin:12px 0; }
  .bars { display:flex; gap:4px; align-items:flex-end; height:48px; margin:24px 0; }
  .bars span { width:10px; background:var(--amber); opacity:.35; }
  a { color:var(--ink); font-weight:600; }
</style>
</head>
<body>
<main>
  <p class="code">404 · SEM SINAL</p>
  <h1>Essa página não existe.</h1>
  <div class="bars" aria-hidden="true"><span style="height:20%"></span><span style="height:12%"></span><span style="height:8%"></span><span style="height:12%"></span><span style="height:6%"></span></div>
  <p>O endereço pode ter mudado. <a href="/">Voltar ao início</a> · <a href="/en/">Back to home</a></p>
</main>
</body>
</html>
